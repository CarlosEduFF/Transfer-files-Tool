[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdftools"
version = "0.1.0"
description = "Comprehensive PDF manipulation CLI"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "Pillow>=10.3.0",
    "weasyprint>=62.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
pdftools = "pdftools.presentation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pdftools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
